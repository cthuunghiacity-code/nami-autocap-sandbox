plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nami.autocap'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nami.autocap'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false
        }
    }
}
