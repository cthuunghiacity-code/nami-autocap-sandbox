name: Patch Existing NAMI Worker With AutoCap

on:
  push:
    branches:
      - main
    paths:
      - "autocap_worker_patch/**"
      - ".github/scripts/deploy_autocap_space.py"
      - ".github/workflows/patch-existing-autocap-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate source
        run: |
          set -euo pipefail
          test -s autocap_worker_patch/app.py
          test -s autocap_worker_patch/autocap_routes.py
          test -s autocap_worker_patch/requirements.txt
          test -s autocap_worker_patch/Dockerfile
          test -s .github/scripts/deploy_autocap_space.py
          python -m py_compile autocap_worker_patch/app.py autocap_worker_patch/autocap_routes.py .github/scripts/deploy_autocap_space.py
          grep -E '^VERSION = "' autocap_worker_patch/autocap_routes.py
          echo "SOURCE_VALIDATION=PASS"

      - name: Install deploy client
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input huggingface_hub

      - name: Upload worker to Hugging Face
        env:
          HF_TOKEN_B64: ${{ secrets.NAMI_HF_TOKEN_B64 }}
          AUTOCAP_KEY_B64: ${{ secrets.NAMI_AUTOCAP_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN_B64"
          test -n "$AUTOCAP_KEY_B64"
          export HF_TOKEN="$(printf '%s' "$HF_TOKEN_B64" | base64 --decode)"
          export AUTOCAP_KEY="$(printf '%s' "$AUTOCAP_KEY_B64" | base64 --decode)"
          python .github/scripts/deploy_autocap_space.py

      - name: Wait for exact worker version
        run: |
          set -euo pipefail
          BASE="https://cthuunghiacity-nc-ai-money-worker.hf.space"
          EXPECTED_VERSION="$(grep -E '^VERSION = "' autocap_worker_patch/autocap_routes.py | head -n 1 | cut -d'"' -f2)"
          test -n "$EXPECTED_VERSION"
          echo "EXPECTED_VERSION=$EXPECTED_VERSION"

          for attempt in $(seq 1 120); do
            HTTP_CODE="$(curl --silent --output /tmp/health.json --write-out '%{http_code}' --max-time 30 "$BASE/autocap/health" || true)"
            ACTUAL_VERSION="$(python -c 'import json; from pathlib import Path; p=Path("/tmp/health.json"); print(json.loads(p.read_text()).get("version","") if p.is_file() else "")' 2>/dev/null || true)"

            echo "ATTEMPT=$attempt HTTP_CODE=$HTTP_CODE ACTUAL_VERSION=$ACTUAL_VERSION"

            if [ "$HTTP_CODE" = "200" ] && [ "$ACTUAL_VERSION" = "$EXPECTED_VERSION" ]; then
              cat /tmp/health.json
              echo
              echo "AUTOCAP_EXPECTED_VERSION=PASS"
              exit 0
            fi

            sleep 20
          done

          echo "WORKER_REBUILD_NOT_READY"
          exit 1
