name: NAMI AutoCap Ephemeral Windows Sandbox

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_ARCHIVE_SHA: b307a74f9258f37b54c5ce3a68b750230a88c2fc2c76ed4708fa550d33085f34
  EXPECTED_AUTOCAP_SHA: 86419372ec32323519eccf116f7dc074006a2d5a71fbbd02661a2658ec73e78c
  HF_REPO: Cthuunghiacity/nami-autopilot-state
  HF_FILE: tools/autocap/b307a74f9258f37b/id_195_AutoCapv1.2.zip

jobs:
  fetch-private-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download AutoCap from private NAMI storage
        env:
          HF_TOKEN_B64: ${{ secrets.NAMI_HF_TOKEN_B64 }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$HF_TOKEN_B64"

          HF_TOKEN="$(
            printf '%s' "$HF_TOKEN_B64" |
            base64 --decode
          )"

          test -n "$HF_TOKEN"

          WHOAMI_HTTP="$(
            curl --silent --show-error               --output "$RUNNER_TEMP/hf-whoami.json"               --write-out '%{http_code}'               --header "Authorization: Bearer ${HF_TOKEN}"               https://huggingface.co/api/whoami-v2
          )"

          echo "HF_WHOAMI_HTTP=$WHOAMI_HTTP"

          if [ "$WHOAMI_HTTP" != "200" ]; then
            cat "$RUNNER_TEMP/hf-whoami.json"
            echo "GITHUB_SECRET_TOKEN_INVALID"
            exit 1
          fi

          URL="https://huggingface.co/datasets/${HF_REPO}/resolve/main/${HF_FILE}"
          mkdir -p "$RUNNER_TEMP/nami-transfer"

          curl \
            --fail \
            --location \
            --retry 4 \
            --retry-delay 3 \
            --header "Authorization: Bearer ${HF_TOKEN}" \
            --output "$RUNNER_TEMP/nami-transfer/source.zip" \
            "$URL"

          ACTUAL_SHA="$(
            sha256sum "$RUNNER_TEMP/nami-transfer/source.zip" |
            awk '{print $1}'
          )"

          echo "ARCHIVE_SHA256=$ACTUAL_SHA"

          test "$ACTUAL_SHA" = "$EXPECTED_ARCHIVE_SHA"

          FILE_SIZE="$(
            stat -c '%s' "$RUNNER_TEMP/nami-transfer/source.zip"
          )"

          echo "ARCHIVE_SIZE=$FILE_SIZE"
          test "$FILE_SIZE" -eq 282871180

      - name: Transfer source privately to Windows job
        uses: actions/upload-artifact@v4
        with:
          name: nami-autocap-private-source
          path: ${{ runner.temp }}/nami-transfer/source.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  sandbox:
    needs: fetch-private-source
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Prepare isolated paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$env:RUNNER_TEMP\nami-autocap" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$env:RUNNER_TEMP\nami-report" |
            Out-Null

      - name: Receive private AutoCap source
        uses: actions/download-artifact@v4
        with:
          name: nami-autocap-private-source
          path: ${{ runner.temp }}/nami-autocap

      - name: Verify archive and extract portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $zip = "$env:RUNNER_TEMP\nami-autocap\source.zip"
          $extract = "$env:RUNNER_TEMP\nami-autocap\extracted"
          $report = "$env:RUNNER_TEMP\nami-report\preflight.txt"

          if (-not (Test-Path $zip)) {
            throw "SOURCE_ZIP_NOT_FOUND"
          }

          $archiveSha = (
            Get-FileHash `
              -Algorithm SHA256 `
              $zip
          ).Hash.ToLowerInvariant()

          if ($archiveSha -ne $env:EXPECTED_ARCHIVE_SHA) {
            throw "ARCHIVE_SHA_MISMATCH=$archiveSha"
          }

          Expand-Archive `
            -LiteralPath $zip `
            -DestinationPath $extract `
            -Force

          $setup = Get-ChildItem `
            -Path $extract `
            -Recurse `
            -File `
            -Filter "*Setup*.exe" |
            Select-Object -First 1

          if (-not $setup) {
            throw "AUTOCAP_SETUP_NOT_FOUND"
          }

          $setupSha = (
            Get-FileHash `
              -Algorithm SHA256 `
              $setup.FullName
          ).Hash.ToLowerInvariant()

          Write-Host "SETUP_NAME=$($setup.Name)"
          Write-Host "SETUP_SHA256=$setupSha"

          Remove-Item Env:HF_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:HF_TOKEN_B64 -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "NAMI AutoCap Setup Block Outbound" `
            -Direction Outbound `
            -Program $setup.FullName `
            -Action Block `
            -Profile Any `
            -ErrorAction SilentlyContinue |
            Out-Null

          $beforeFiles = Get-ChildItem `
            "$env:LOCALAPPDATA","$env:APPDATA","$env:ProgramFiles" `
            -Recurse `
            -File `
            -Filter "*.exe" `
            -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName

          $installArguments = @(
            "/S"
            "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-"
          )

          $installed = $false
          $installLog = @()

          foreach ($arguments in $installArguments) {
            try {
              $process = Start-Process `
                -FilePath $setup.FullName `
                -ArgumentList $arguments `
                -PassThru

              if (-not $process.WaitForExit(90000)) {
                Stop-Process `
                  -Id $process.Id `
                  -Force `
                  -ErrorAction SilentlyContinue

                $installLog += "ARGS=$arguments TIMEOUT=true"
              }
              else {
                $installLog += "ARGS=$arguments EXIT=$($process.ExitCode)"

                if ($process.ExitCode -eq 0) {
                  $installed = $true
                  break
                }
              }
            }
            catch {
              $installLog += "ARGS=$arguments ERROR=$($_.Exception.Message)"
            }
          }

          $installLog |
            Out-File "$env:RUNNER_TEMP\nami-report\installer.txt"

          if (-not $installed) {
            throw "AUTOCAP_SILENT_INSTALL_FAILED"
          }

          $afterExe = Get-ChildItem `
            "$env:LOCALAPPDATA","$env:APPDATA","$env:ProgramFiles" `
            -Recurse `
            -File `
            -Filter "*.exe" `
            -ErrorAction SilentlyContinue

          $newExe = $afterExe |
            Where-Object {
              $_.FullName -notin $beforeFiles
            }

          $inventory = foreach ($candidate in $newExe) {
            $candidateSha = (
              Get-FileHash `
                -Algorithm SHA256 `
                $candidate.FullName
            ).Hash.ToLowerInvariant()

            [PSCustomObject]@{
              Name = $candidate.Name
              FullName = $candidate.FullName
              Sha256 = $candidateSha
              Size = $candidate.Length
            }
          }

          $inventory |
            Export-Csv `
              "$env:RUNNER_TEMP\nami-report\installed-exe-inventory.csv" `
              -NoTypeInformation `
              -Encoding UTF8

          $exe = $newExe |
            Where-Object {
              $_.Name -match "AutoCap"
            } |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $exe) {
            throw "INSTALLED_AUTOCAP_EXE_NOT_FOUND"
          }

          $exeSha = (
            Get-FileHash `
              -Algorithm SHA256 `
              $exe.FullName
          ).Hash.ToLowerInvariant()

          Write-Host "AUTOCAP_INSTALLED_PATH=$($exe.FullName)"
          Write-Host "AUTOCAP_INSTALLED_SHA=$exeSha"
          @(
            "ARCHIVE_SHA256=$archiveSha"
            "AUTOCAP_PATH=$($exe.FullName)"
            "AUTOCAP_SHA256=$exeSha"
            "ARCHIVE_VERIFIED=true"
            "AUTOCAP_VERIFIED=true"
          ) | Out-File $report

          "AUTOCAP_EXE=$($exe.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append

      - name: Microsoft Defender scan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $report = "$env:RUNNER_TEMP\nami-report\defender.txt"

          $defender = @(
            "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
            "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe"
          ) |
          ForEach-Object {
            Get-Item $_ -ErrorAction SilentlyContinue
          } |
          Sort-Object FullName -Descending |
          Select-Object -First 1

          if (-not $defender) {
            throw "DEFENDER_COMMAND_NOT_FOUND"
          }

          & $defender.FullName `
            -Scan `
            -ScanType 3 `
            -File "$env:AUTOCAP_EXE" 2>&1 |
            Tee-Object -FilePath $report

          $exitCode = $LASTEXITCODE
          "DEFENDER_EXIT_CODE=$exitCode" |
            Out-File `
              -FilePath $report `
              -Append

          if ($exitCode -notin @(0, 2)) {
            throw "DEFENDER_SCAN_FAILED=$exitCode"
          }

      - name: Deep security metadata and Defender audit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $reportDir = "$env:RUNNER_TEMP\nami-report"
          $installDir = Split-Path $env:AUTOCAP_EXE -Parent
          $report = "$reportDir\security-deep-audit.txt"

          $signature = Get-AuthenticodeSignature `
            -FilePath $env:AUTOCAP_EXE

          $file = Get-Item $env:AUTOCAP_EXE
          $version = $file.VersionInfo

          @(
            "AUTOCAP_PATH=$env:AUTOCAP_EXE"
            "AUTOCAP_SIZE=$($file.Length)"
            "SIGNATURE_STATUS=$($signature.Status)"
            "SIGNER_SUBJECT=$($signature.SignerCertificate.Subject)"
            "SIGNER_ISSUER=$($signature.SignerCertificate.Issuer)"
            "PRODUCT_NAME=$($version.ProductName)"
            "FILE_DESCRIPTION=$($version.FileDescription)"
            "COMPANY_NAME=$($version.CompanyName)"
            "FILE_VERSION=$($version.FileVersion)"
            "PRODUCT_VERSION=$($version.ProductVersion)"
            "INSTALL_DIR=$installDir"
          ) | Out-File $report

          try {
            Start-MpScan `
              -ScanType CustomScan `
              -ScanPath $installDir

            "START_MPSCAN_CALLED=true" |
              Out-File $report -Append
          }
          catch {
            "START_MPSCAN_ERROR=$($_.Exception.Message)" |
              Out-File $report -Append
          }

          Start-Sleep -Seconds 20

          try {
            $status = Get-MpComputerStatus

            @(
              "DEFENDER_ENABLED=$($status.AntivirusEnabled)"
              "REALTIME_PROTECTION=$($status.RealTimeProtectionEnabled)"
              "ANTISPYWARE_ENABLED=$($status.AntispywareEnabled)"
              "SIGNATURE_VERSION=$($status.AntivirusSignatureVersion)"
              "LAST_FULL_SCAN=$($status.FullScanEndTime)"
              "LAST_QUICK_SCAN=$($status.QuickScanEndTime)"
            ) | Out-File $report -Append
          }
          catch {
            "DEFENDER_STATUS_ERROR=$($_.Exception.Message)" |
              Out-File $report -Append
          }

          try {
            $threats = Get-MpThreatDetection

            if ($threats) {
              "THREAT_DETECTION_COUNT=$($threats.Count)" |
                Out-File $report -Append

              $threats |
                Format-List * |
                Out-String |
                Out-File $report -Append
            }
            else {
              "THREAT_DETECTION_COUNT=0" |
                Out-File $report -Append
            }
          }
          catch {
            "THREAT_QUERY_ERROR=$($_.Exception.Message)" |
              Out-File $report -Append
          }

      - name: Audit AutoCap command line and configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $reportDir = "$env:RUNNER_TEMP\nami-report"
          $report = "$reportDir\automation-interface-audit.txt"
          $configReport = "$reportDir\autocap-config-files.txt"
          $installDir = Split-Path $env:AUTOCAP_EXE -Parent

          Remove-Item Env:HF_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:HF_TOKEN_B64 -ErrorAction SilentlyContinue
          Remove-Item Env:NAMI_HF_READ_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "NAMI AutoCap Audit Block Outbound" `
            -Direction Outbound `
            -Program $env:AUTOCAP_EXE `
            -Action Block `
            -Profile Any `
            -ErrorAction SilentlyContinue |
            Out-Null

          $rule = Get-NetFirewallRule `
            -DisplayName "NAMI AutoCap Audit Block Outbound" `
            -ErrorAction SilentlyContinue

          @(
            "AUTOCAP_EXE=$env:AUTOCAP_EXE"
            "INSTALL_DIR=$installDir"
            "OUTBOUND_RULE_EXISTS=$([bool]$rule)"
            "CLI_AUDIT_STARTED=true"
          ) | Out-File $report

          $tests = @(
            "--help"
            "-h"
            "/?"
            "--version"
            "-version"
          )

          foreach ($argument in $tests) {
            $safeName = $argument `
              -replace '[^a-zA-Z0-9]', '_'

            $stdout = "$reportDir\cli_${safeName}_stdout.txt"
            $stderr = "$reportDir\cli_${safeName}_stderr.txt"

            try {
              $process = Start-Process `
                -FilePath $env:AUTOCAP_EXE `
                -ArgumentList $argument `
                -RedirectStandardOutput $stdout `
                -RedirectStandardError $stderr `
                -PassThru

              $finished = $process.WaitForExit(10000)

              if (-not $finished) {
                Stop-Process `
                  -Id $process.Id `
                  -Force `
                  -ErrorAction SilentlyContinue

                "ARG=$argument TIMEOUT=true" |
                  Out-File $report -Append
              }
              else {
                "ARG=$argument EXIT=$($process.ExitCode)" |
                  Out-File $report -Append
              }
            }
            catch {
              "ARG=$argument ERROR=$($_.Exception.Message)" |
                Out-File $report -Append
            }
          }

          $roots = @(
            $installDir
            "$env:LOCALAPPDATA\AutoCap"
            "$env:APPDATA\AutoCap"
            "$env:USERPROFILE\.autocap"
            "$env:USERPROFILE\Documents"
          )

          $patterns = @(
            "*.json"
            "*.ini"
            "*.yaml"
            "*.yml"
            "*.toml"
            "*.cfg"
            "*.conf"
            "*.db"
            "*.sqlite"
            "*.log"
          )

          foreach ($root in $roots) {
            if (-not (Test-Path $root)) {
              continue
            }

            foreach ($pattern in $patterns) {
              Get-ChildItem `
                -Path $root `
                -Recurse `
                -File `
                -Filter $pattern `
                -ErrorAction SilentlyContinue |
                Select-Object FullName, Length, LastWriteTime |
                Format-Table -AutoSize |
                Out-String |
                Out-File $configReport -Append
            }
          }

          $resourceKeywords = @(
            "subtitle"
            "translate"
            "translation"
            "export"
            "ffmpeg"
            "api"
            "token"
            "project"
            "video"
            "output"
          )

          $textFiles = Get-ChildItem `
            -Path $installDir `
            -Recurse `
            -File `
            -Include "*.json","*.ini","*.yaml","*.yml","*.cfg","*.conf","*.txt" `
            -ErrorAction SilentlyContinue

          foreach ($item in $textFiles) {
            foreach ($keyword in $resourceKeywords) {
              $matches = Select-String `
                -Path $item.FullName `
                -Pattern $keyword `
                -SimpleMatch `
                -ErrorAction SilentlyContinue

              if ($matches) {
                "KEYWORD=$keyword FILE=$($item.FullName)" |
                  Out-File $configReport -Append
              }
            }
          }

          "CLI_AUDIT_FINISHED=true" |
            Out-File $report -Append

      - name: Audit AutoCap GUI structure safely
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $reportDir = "$env:RUNNER_TEMP\nami-report"
          $installDir = Split-Path $env:AUTOCAP_EXE -Parent
          $guiReport = "$reportDir\gui-automation-tree.txt"
          $configReport = "$reportDir\config-redacted.json"
          $screenPath = "$reportDir\autocap-window.png"
          $sampleVideo = "$env:RUNNER_TEMP\nami-report\synthetic-test.mp4"

          Remove-Item Env:HF_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:HF_TOKEN_B64 -ErrorAction SilentlyContinue
          Remove-Item Env:NAMI_HF_READ_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "NAMI AutoCap GUI Audit Block Outbound" `
            -Direction Outbound `
            -Program $env:AUTOCAP_EXE `
            -Action Block `
            -Profile Any `
            -ErrorAction SilentlyContinue |
            Out-Null

          $ffmpeg = Join-Path $installDir "ffmpeg\ffmpeg.exe"

          if (Test-Path $ffmpeg) {
            & $ffmpeg `
              -y `
              -f lavfi `
              -i "color=c=black:s=640x360:d=3" `
              -f lavfi `
              -i "sine=frequency=440:duration=3" `
              -shortest `
              -c:v libx264 `
              -pix_fmt yuv420p `
              -c:a aac `
              $sampleVideo 2>&1 |
              Out-File "$reportDir\synthetic-video-build.txt"

            "SYNTHETIC_VIDEO_CREATED=$([bool](Test-Path $sampleVideo))" |
              Out-File $guiReport
          }
          else {
            "SYNTHETIC_VIDEO_CREATED=false" |
              Out-File $guiReport
          }

          $config = Join-Path $installDir "config.json"

          if (Test-Path $config) {
            try {
              $raw = Get-Content $config -Raw |
                ConvertFrom-Json

              function Redact-Object {
                param([object]$Value)

                if ($null -eq $Value) {
                  return $null
                }

                if ($Value -is [System.Collections.IDictionary]) {
                  $result = [ordered]@{}

                  foreach ($key in $Value.Keys) {
                    if ($key -match '(?i)token|secret|password|api.?key|credential|authorization') {
                      $result[$key] = "[REDACTED]"
                    }
                    else {
                      $result[$key] = Redact-Object $Value[$key]
                    }
                  }

                  return $result
                }

                if ($Value -is [PSCustomObject]) {
                  $result = [ordered]@{}

                  foreach ($property in $Value.PSObject.Properties) {
                    if ($property.Name -match '(?i)token|secret|password|api.?key|credential|authorization') {
                      $result[$property.Name] = "[REDACTED]"
                    }
                    else {
                      $result[$property.Name] = Redact-Object $property.Value
                    }
                  }

                  return $result
                }

                if (
                  $Value -is [System.Collections.IEnumerable] -and
                  $Value -isnot [string]
                ) {
                  return @(
                    foreach ($item in $Value) {
                      Redact-Object $item
                    }
                  )
                }

                return $Value
              }

              $redacted = Redact-Object $raw
              $redacted |
                ConvertTo-Json -Depth 20 |
                Out-File $configReport -Encoding UTF8

              "CONFIG_REDACTED=true" |
                Out-File $guiReport -Append
            }
            catch {
              "CONFIG_REDACTION_ERROR=$($_.Exception.Message)" |
                Out-File $guiReport -Append
            }
          }
          else {
            "CONFIG_FILE_FOUND=false" |
              Out-File $guiReport -Append
          }

          try {
            $process = Start-Process `
              -FilePath $env:AUTOCAP_EXE `
              -PassThru

            Start-Sleep -Seconds 12
            $process.Refresh()

            @(
              "AUTOCAP_PID=$($process.Id)"
              "MAIN_WINDOW_HANDLE=$($process.MainWindowHandle)"
              "MAIN_WINDOW_TITLE=$($process.MainWindowTitle)"
              "PROCESS_EXITED=$($process.HasExited)"
            ) | Out-File $guiReport -Append

            Add-Type -AssemblyName UIAutomationClient
            Add-Type -AssemblyName UIAutomationTypes

            if ($process.MainWindowHandle -ne 0) {
              $root = [System.Windows.Automation.AutomationElement]::FromHandle(
                $process.MainWindowHandle
              )

              $condition = [System.Windows.Automation.Condition]::TrueCondition
              $elements = $root.FindAll(
                [System.Windows.Automation.TreeScope]::Descendants,
                $condition
              )

              "UI_ELEMENT_COUNT=$($elements.Count)" |
                Out-File $guiReport -Append

              for ($index = 0; $index -lt $elements.Count; $index++) {
                $element = $elements.Item($index)

                try {
                  $current = $element.Current

                  @(
                    "INDEX=$index"
                    "NAME=$($current.Name)"
                    "AUTOMATION_ID=$($current.AutomationId)"
                    "CONTROL_TYPE=$($current.ControlType.ProgrammaticName)"
                    "CLASS_NAME=$($current.ClassName)"
                    "IS_ENABLED=$($current.IsEnabled)"
                    "IS_OFFSCREEN=$($current.IsOffscreen)"
                    "BOUNDING_RECT=$($current.BoundingRectangle)"
                    "---"
                  ) | Out-File $guiReport -Append
                }
                catch {
                  "INDEX=$index READ_ERROR=$($_.Exception.Message)" |
                    Out-File $guiReport -Append
                }
              }

              try {
                Add-Type -AssemblyName System.Drawing

                $rectangle = $root.Current.BoundingRectangle
                $width = [Math]::Max(1, [int]$rectangle.Width)
                $height = [Math]::Max(1, [int]$rectangle.Height)

                $bitmap = New-Object System.Drawing.Bitmap(
                  $width,
                  $height
                )

                $graphics = [System.Drawing.Graphics]::FromImage($bitmap)

                $graphics.CopyFromScreen(
                  [int]$rectangle.X,
                  [int]$rectangle.Y,
                  0,
                  0,
                  $bitmap.Size
                )

                $bitmap.Save(
                  $screenPath,
                  [System.Drawing.Imaging.ImageFormat]::Png
                )

                $graphics.Dispose()
                $bitmap.Dispose()

                "WINDOW_SCREENSHOT_CREATED=true" |
                  Out-File $guiReport -Append
              }
              catch {
                "WINDOW_SCREENSHOT_ERROR=$($_.Exception.Message)" |
                  Out-File $guiReport -Append
              }
            }
            else {
              "GUI_WINDOW_NOT_AVAILABLE=true" |
                Out-File $guiReport -Append
            }

            if (-not $process.HasExited) {
              Stop-Process `
                -Id $process.Id `
                -Force `
                -ErrorAction SilentlyContinue
            }
          }
          catch {
            "GUI_AUDIT_START_ERROR=$($_.Exception.Message)" |
              Out-File $guiReport -Append
          }

          Remove-Item $sampleVideo -Force -ErrorAction SilentlyContinue

          "PRIVATE_USER_VIDEO_USED=false" |
            Out-File $guiReport -Append

          "GUI_AUDIT_FINISHED=true" |
            Out-File $guiReport -Append

      - name: Restricted launch and behavior capture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $reportDir = "$env:RUNNER_TEMP\nami-report"
          $launchReport = "$reportDir\launch.txt"

          Remove-Item Env:HF_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:NAMI_HF_READ_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue

          $exePath = $env:AUTOCAP_EXE

          New-NetFirewallRule `
            -DisplayName "NAMI AutoCap Block Outbound" `
            -Direction Outbound `
            -Program $exePath `
            -Action Block `
            -Profile Any `
            -ErrorAction SilentlyContinue |
            Out-Null

          New-NetFirewallRule `
            -DisplayName "NAMI AutoCap Block Inbound" `
            -Direction Inbound `
            -Program $exePath `
            -Action Block `
            -Profile Any `
            -ErrorAction SilentlyContinue |
            Out-Null

          $before = Get-Process |
            Select-Object Id, ProcessName

          $started = $false
          $startError = ""

          try {
            $process = Start-Process `
              -FilePath $exePath `
              -PassThru `
              -WindowStyle Normal

            $started = $true
            Start-Sleep -Seconds 15

            if (-not $process.HasExited) {
              Stop-Process `
                -Id $process.Id `
                -Force `
                -ErrorAction SilentlyContinue
            }
          }
          catch {
            $startError = $_.Exception.Message
          }

          $after = Get-Process |
            Select-Object Id, ProcessName

          $newProcesses = Compare-Object `
            $before `
            $after `
            -Property Id, ProcessName |
            Where-Object SideIndicator -eq "=>"

          @(
            "AUTOCAP_STARTED=$started"
            "START_ERROR=$startError"
            "NETWORK_BLOCK_RULES_ATTEMPTED=true"
            "OBSERVATION_SECONDS=15"
            "NEW_PROCESSES:"
            ($newProcesses | Out-String)
          ) | Out-File $launchReport

      - name: Delete downloaded binaries before report upload
        if: always()
        shell: pwsh
        run: |
          Remove-Item `
            -Recurse `
            -Force `
            "$env:RUNNER_TEMP\nami-autocap" `
            -ErrorAction SilentlyContinue

      - name: Upload reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nami-autocap-sandbox-reports
          path: ${{ runner.temp }}/nami-report/**
          if-no-files-found: warn
          retention-days: 3
